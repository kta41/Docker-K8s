apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openwebui-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kta41/openwebui-ai-config.git
    path: .
    targetRevision: main
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
